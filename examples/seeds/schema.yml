version: 2

seeds:
  - name: raw_orders
    config:
      column_types:
        order_id: string
        customer_id: string
        amount: decimal(10,2)
        status: string
        region: string
        dt: string
        updated_at: timestamp

  - name: raw_customers
    config:
      column_types:
        customer_id: string
        name: string
        email: string
        phone: string
        city: string
        updated_at: timestamp

  - name: raw_events
    config:
      column_types:
        event_id: string
        user_id: string
        event_type: string
        event_time: timestamp
        page: string
