clickzetta_example:
  target: dev
  outputs:
    dev:
      type: clickzetta
      service: cn-shanghai-alicloud.api.clickzetta.com
      instance: your_instance        # 替换为你的 instance
      workspace: your_workspace      # 替换为你的 workspace
      username: your_username        # 替换为你的用户名
      password: your_password        # 替换为你的密码
      schema: example                # 模型写入的 schema
      vcluster: default_ap           # 替换为你的 vcluster 名称
