version: 2

models:
  - name: stg_orders
    description: "订单清洗视图，过滤掉 order_id 为空的行"
    columns:
      - name: order_id
        data_tests:
          - not_null
          - unique
      - name: customer_id
        data_tests:
          - not_null
      - name: amount
        data_tests:
          - not_null
      - name: status
        data_tests:
          - accepted_values:
              values: ['completed', 'pending', 'cancelled']

  - name: stg_customers
    description: "客户清洗视图"
    columns:
      - name: customer_id
        data_tests:
          - not_null
          - unique

  - name: dim_customers
    description: "客户汇总宽表：每个客户的订单数和总金额"
    columns:
      - name: customer_id
        data_tests:
          - not_null
          - unique
      - name: order_count
        data_tests:
          - not_null
      - name: total_amount
        data_tests:
          - not_null

  - name: fct_orders_incremental
    description: "增量订单事实表（merge 策略）"
    columns:
      - name: order_id
        data_tests:
          - not_null
          - unique

  - name: fct_orders_partitioned
    description: "按 dt 分区的订单宽表"
    columns:
      - name: order_id
        data_tests:
          - not_null
          - unique

  - name: daily_revenue
    description: "按日期和区域汇总的营收（insert_overwrite 增量）"
    columns:
      - name: dt
        data_tests:
          - not_null
      - name: region
        data_tests:
          - not_null
      - name: revenue
        data_tests:
          - not_null

  - name: regional_revenue_with_grants
    description: "按区域汇总的营收，演示 grants 授权"
    columns:
      - name: region
        data_tests:
          - not_null
          - unique

  - name: customer_stats_dynamic
    description: "动态表：每 5 分钟自动刷新的客户统计"
    columns:
      - name: customer_id
        data_tests:
          - not_null
          - unique
      - name: order_count
        data_tests:
          - not_null
      - name: total_amount
        data_tests:
          - not_null

  - name: regional_daily_mv
    description: "物化视图：区域日营收"
    columns:
      - name: region
        data_tests:
          - not_null
      - name: dt
        data_tests:
          - not_null
      - name: revenue
        data_tests:
          - not_null

  - name: orders_with_indexes
    description: "演示索引自动创建：Bloomfilter（order_id, customer_id）+ 倒排（status）"
    columns:
      - name: order_id
        data_tests:
          - not_null
          - unique

  - name: orders_clone
    description: "零拷贝克隆示例：克隆自 fct_orders_partitioned"
    columns:
      - name: order_id
        data_tests:
          - not_null
          - unique

  - name: orders_clone_timetravel
    description: "Time Travel 克隆示例：克隆指定时间点的历史版本"
    columns:
      - name: order_id
        data_tests:
          - not_null
          - unique
