version: 2

sources:
  - name: example_streams
    database: "{{ target.database }}"
    schema: "{{ target.schema }}"
    description: "ClickZetta Table Stream sources for CDC change capture"
    tables:
      - name: orders_stream
        description: >
          Change stream on fct_orders_incremental. Captures INSERT/UPDATE/DELETE.
          System columns appended to every row: __change_type, __commit_version, __commit_timestamp.
          Use SELECT * EXCEPT(__change_type, __commit_timestamp, __commit_version) to read only user columns.
