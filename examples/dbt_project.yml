name: clickzetta_example
version: '1.0.0'
config-version: 2

profile: clickzetta_example

model-paths: ["models"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]
macro-paths: ["macros"]
test-paths: ["tests"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

on-run-end:
  # Create the orders_stream used by stream_changes model.
  # Runs after all models so fct_orders_incremental exists first.
  # IF NOT EXISTS ensures this is idempotent across runs.
  - "CREATE TABLE STREAM IF NOT EXISTS {{ target.schema }}.orders_stream ON TABLE {{ target.schema }}.fct_orders_incremental WITH PROPERTIES ('TABLE_STREAM_MODE' = 'STANDARD')"



models:
  clickzetta_example:
    staging:
      +materialized: view
    marts:
      +materialized: table
    advanced:
      +materialized: table

seeds:
  clickzetta_example:
    +schema: raw
    v1:
      # Baseline data for snapshot history setup — disabled by default.
      # See README "Snapshot History Verification" for usage.
      +enabled: false
