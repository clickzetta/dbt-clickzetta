name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, for example 1.5.2. Leave empty to use package metadata."
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run unit tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r dev-requirements.txt
          python -m pip install -e .
          python -m pytest tests/unit

      - name: Build distributions
        run: |
          python -m pip install packaging
          python -m build
          python -m twine check dist/*

      - name: Read package version
        id: meta
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          from packaging.utils import parse_wheel_filename

          wheels = sorted(Path("dist").glob("*.whl"))
          if not wheels:
              raise SystemExit("No wheel found in dist/")

          _, version, *_ = parse_wheel_filename(wheels[0].name)
          print(f"version={version}")
          print(f"tag=v{version}")
          PY

      - name: Check requested version
        if: ${{ inputs.version != '' && inputs.version != steps.meta.outputs.version }}
        run: |
          echo "Input version '${{ inputs.version }}' does not match package version '${{ steps.meta.outputs.version }}'"
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  tag-and-github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Create tag
        run: |
          TAG="${{ needs.build.outputs.tag }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; reusing it for this release."
          else
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.build.outputs.tag }}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            gh release create "$TAG" dist/* \
              --title "$TAG" \
              --notes "Release $TAG" \
              --verify-tag
          fi

  publish-to-pypi:
    needs: [build, tag-and-github-release]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/dbt-clickzetta/
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
