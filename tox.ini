[tox]
skipsdist = True
envlist = py39,py310,py311,py312

[testenv:{unit,py39,py310,py311,py312,py}]
description = unit testing
skip_install = true
passenv =
    DBT_*
    PYTEST_ADDOPTS
commands = {envpython} -m pytest {posargs} tests/unit
deps =
  -rdev-requirements.txt
  -e.

[testenv:{integration,py39,py310,py311,py312,py}-{clickzetta}]
description = adapter plugin integration testing
skip_install = true
passenv =
    DBT_*
    CLICKZETTA_TEST_*
    PYTEST_ADDOPTS
commands =
  clickzetta: {envpython} -m pytest {posargs} tests/functional
deps =
  -rdev-requirements.txt
  -e.
